name: monolith
services:
  mailpit:
    image: axllent/mailpit:v1.33.0
    ports:
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: monolith
      POSTGRES_PASSWORD: monolith_local_dev
      POSTGRES_DB: monolith
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - monolith_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monolith -d monolith"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  monolith_data:
